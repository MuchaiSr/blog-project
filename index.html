<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="./style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>

  <main>

    <div><img src="./images/illustration-article.svg" alt="Yellow image illustration"></div>

    <button class="custom-cursor">Learning</button>

    <div>Published 21 Dec 2023</div>

    <div><h2>HTML & CSS foundations</h2></div>

    <div class="text">These languages are the backbone of every website, defining structure, content, and presentation.</div>

    <div class="profile">
      <img src="./images/image-avatar.webp" alt="Image avatar of a person">
      <div>Greg Hooper</div>
    </div>

  </main>
  
  <footer>

    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/MuchaiSr">MuchaiSr</a>.
    </div>

  </footer>

</html>
